<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NBA Scorigami Cube</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0f12; color: #e6e8eb;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; }
  .panel {
    position: absolute; padding: 14px 16px;
    background: rgba(20, 22, 26, 0.85); border: 1px solid #2a2f36; border-radius: 8px;
    backdrop-filter: blur(6px); font-size: 13px; line-height: 1.45;
  }
  #info { top: 12px; left: 12px; min-width: 280px; max-width: 340px; }
  #detail { top: 12px; right: 12px; min-width: 260px; max-width: 320px; display: none; }
  #leaders {
    bottom: 12px; right: 12px; max-width: 280px; max-height: 50vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  h1, h2 { font-size: 14px; margin: 0 0 8px 0; letter-spacing: .02em; }
  .hint { color: #8b94a0; font-size: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .row .k { color: #8b94a0; }
  .row .v { color: #e6e8eb; font-variant-numeric: tabular-nums; }

  #legend { margin-top: 10px; display: flex; gap: 10px; align-items: center; font-size: 12px; }
  #legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,.15); }

  #controls { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12px; }
  #controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #controls .sliderRow { display: grid; grid-template-columns: 78px 1fr 36px; align-items: center; gap: 8px; }
  #controls .sliderRow input[type="range"] { width: 100%; }
  #controls .sliderRow .num { font-variant-numeric: tabular-nums; color: #8b94a0; font-size: 11px; text-align: right; }
  #controls select {
    background: #181b21; color: #e6e8eb; border: 1px solid #2a2f36; border-radius: 4px;
    padding: 3px 6px; font-size: 12px; width: 100%;
  }
  #axisGrid {
    display: grid; grid-template-columns: 24px 1fr; gap: 6px 8px; align-items: center;
    margin-top: 8px; padding: 8px 10px; background: rgba(0,0,0,0.18); border-radius: 6px;
  }
  #axisGrid .lab { font-weight: 600; font-variant-numeric: tabular-nums; }

  #detail .pra { font-size: 16px; font-weight: 600; color: #f7c948; margin-bottom: 6px; }
  #detail .empty { color: #8b94a0; font-style: italic; }

  #lbList { overflow-y: auto; flex: 1 1 auto; margin-top: 4px; padding-right: 4px; }
  #lbList::-webkit-scrollbar { width: 6px; }
  #lbList::-webkit-scrollbar-thumb { background: #2a2f36; border-radius: 3px; }
  .lbRow {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 4px 2px;
    border-bottom: 1px solid rgba(255,255,255,.04); align-items: baseline;
  }
  .lbRow .rk { color: #8b94a0; font-size: 11px; }
  .lbRow .nm { font-size: 13px; }
  .lbRow .ct { color: #f7c948; font-variant-numeric: tabular-nums; font-size: 12px; }

  #status {
    position: absolute; bottom: 12px; left: 12px; padding: 8px 12px;
    background: rgba(20,22,26,.8); border: 1px solid #2a2f36; border-radius: 6px; font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="info" class="panel">
  <h1>NBA Scorigami Cube</h1>
  <div class="hint" id="axisHint">choose any three stats for the axes</div>

  <div id="axisGrid">
    <span class="lab" style="color:#ff6b6b">X</span><select id="axisX"></select>
    <span class="lab" style="color:#6bd06b">Y</span><select id="axisY"></select>
    <span class="lab" style="color:#6b9eff">Z</span><select id="axisZ"></select>
  </div>

  <div id="legend">
    <span><span class="sw" style="background:#4b4f57"></span>0</span>
    <span><span class="sw" style="background:#e53935"></span>1</span>
    <span><span class="sw" style="background:#43a047"></span>2+</span>
  </div>

  <div id="controls">
    <label><input type="checkbox" id="showZeros" /> show zero cells</label>
    <div class="sliderRow">
      <span>opacity</span>
      <input type="range" id="globalAlpha" min="0" max="1" step="0.01" value="1.0" />
      <span class="num" id="globalAlphaNum">1.00</span>
    </div>
    <div class="sliderRow">
      <span>peel</span>
      <input type="range" id="peel" min="0" max="1" step="0.005" value="0" />
      <span class="num" id="peelNum">0.00</span>
    </div>
    <label><input type="checkbox" id="showAxes" checked /> show axes</label>
  </div>

  <div class="hint" style="margin-top:10px">drag = orbit · scroll = zoom · right-drag = pan · click a cell</div>
</div>

<div id="detail" class="panel">
  <h2>Cell details</h2>
  <div id="detailBody"></div>
</div>

<div id="leaders" class="panel">
  <h2>Scorigami leaderboard</h2>
  <div class="hint" id="lbHint">Most unique stat lines (n=1)</div>
  <div id="lbList"></div>
</div>

<div id="status">loading...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COLOR_ZERO  = new THREE.Color(0x4b4f57);
const COLOR_ONE   = new THREE.Color(0xe53935);
const COLOR_MANY  = new THREE.Color(0x43a047);
const COLOR_HOVER = new THREE.Color(0xfff3a0);

const statusEl    = document.getElementById('status');
const detailEl    = document.getElementById('detail');
const detailBodyEl = document.getElementById('detailBody');
const lbListEl    = document.getElementById('lbList');
const lbHintEl    = document.getElementById('lbHint');
const axisHintEl  = document.getElementById('axisHint');

const axisXEl = document.getElementById('axisX');
const axisYEl = document.getElementById('axisY');
const axisZEl = document.getElementById('axisZ');

const SHARED = {
  uGlobalOpacity: { value: 1.0 },
};

function bucketColor(n) {
  if (n === 0) return COLOR_ZERO;
  if (n === 1) return COLOR_ONE;
  return COLOR_MANY;
}

function patchMaterial(material, extraMul = 1.0, alwaysTransparent = false) {
  // Default to opaque so voxels properly occlude each other from every
  // angle. The opacity slider flips the occupied material into transparent
  // mode only when the user actually pulls it below 1.0. Greys keep
  // alwaysTransparent=true because the 0.18 multiplier requires blending.
  material.transparent = alwaysTransparent;
  material.depthWrite = !alwaysTransparent;
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uGlobalOpacity = SHARED.uGlobalOpacity;
    shader.fragmentShader =
      'uniform float uGlobalOpacity;\n' +
      shader.fragmentShader.replace(
        '#include <opaque_fragment>',
        `#include <opaque_fragment>
         gl_FragColor.a *= clamp(uGlobalOpacity * ${extraMul.toFixed(4)}, 0.0, 1.0);`
      );
  };
}

function makeLabel(text, color = '#e6e8eb', heightUnits = 14) {
  const fontPx = 64;
  const pad = 16;
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `bold ${fontPx}px -apple-system, "Segoe UI", sans-serif`;
  const w = Math.ceil(measure.measureText(text).width) + pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = fontPx + pad * 2;
  const ctx = canvas.getContext('2d');
  ctx.font = `bold ${fontPx}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 8;
  ctx.fillText(text, pad, canvas.height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.renderOrder = 999;
  sprite.scale.set((canvas.width / canvas.height) * heightUnits, heightUnits, 1);
  return sprite;
}

// ---- scene setup (one time) ----
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir = new THREE.DirectionalLight(0xffffff, 0.7);
dir.position.set(1, 1.5, 1);
scene.add(dir);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Container for cube-specific objects. We swap out its contents on stat change.
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

// State for the currently-active cube.
const state = {
  occMesh: null,
  zeroMesh: null,
  instanceIndex: [],
  zeroIndex: [],
  occupied: null,
  MAX_X: 0, MAX_Y: 0, MAX_Z: 0,
  axes: null,
};

let hoverColorRestore = null;

function disposeNode(n) {
  if (!n) return;
  if (n.geometry) n.geometry.dispose();
  if (n.material) {
    if (Array.isArray(n.material)) n.material.forEach(m => m.dispose());
    else n.material.dispose();
  }
}

function clearCube() {
  // dispose previous meshes
  while (cubeGroup.children.length) {
    const c = cubeGroup.children.pop();
    cubeGroup.remove(c);
    disposeNode(c);
    // Sprite map textures
    if (c.material && c.material.map) c.material.map.dispose();
  }
  state.occMesh = null;
  state.zeroMesh = null;
  state.instanceIndex = [];
  state.zeroIndex = [];
  state.occupied = null;
  hoverColorRestore = null;
}

function clearHover() {
  if (hoverColorRestore) {
    const { mesh, id, color } = hoverColorRestore;
    mesh.setColorAt(id, color);
    mesh.instanceColor.needsUpdate = true;
    hoverColorRestore = null;
  }
}

function setHover(mesh, id) {
  clearHover();
  if (!mesh.instanceColor) return;
  const orig = new THREE.Color();
  mesh.getColorAt(id, orig);
  hoverColorRestore = { mesh, id, color: orig.clone() };
  mesh.setColorAt(id, COLOR_HOVER);
  mesh.instanceColor.needsUpdate = true;
}

function buildCube(data) {
  clearCube();

  const axes = data.axes;
  state.axes = axes;
  const MAX_X = axes.x.max, MAX_Y = axes.y.max, MAX_Z = axes.z.max;
  state.MAX_X = MAX_X; state.MAX_Y = MAX_Y; state.MAX_Z = MAX_Z;

  // Sort occupied cells ascending by Euclidean distance from origin so the
  // peel slider can just truncate mesh.count to hide outer layers.
  const cells = data.cells.slice().sort((c1, c2) => {
    const d1 = c1.p*c1.p + c1.r*c1.r + c1.a*c1.a;
    const d2 = c2.p*c2.p + c2.r*c2.r + c2.a*c2.a;
    return d1 - d2;
  });

  const occupied = new Map();
  for (const c of cells) occupied.set(`${c.p},${c.r},${c.a}`, c);
  state.occupied = occupied;

  // --- Occupied voxels ---
  const geomOcc = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  const matOcc = new THREE.MeshLambertMaterial();
  patchMaterial(matOcc, 1.0, /* alwaysTransparent */ false);

  const occMesh = new THREE.InstancedMesh(geomOcc, matOcc, Math.max(1, cells.length));
  occMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

  const dummy = new THREE.Object3D();
  const instanceIndex = [];
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    dummy.position.set(c.p, c.r, c.a);
    dummy.updateMatrix();
    occMesh.setMatrixAt(i, dummy.matrix);
    occMesh.setColorAt(i, bucketColor(c.n));
    instanceIndex.push(c);
  }
  occMesh.instanceMatrix.needsUpdate = true;
  if (occMesh.instanceColor) occMesh.instanceColor.needsUpdate = true;
  cubeGroup.add(occMesh);
  state.occMesh = occMesh;
  state.instanceIndex = instanceIndex;

  // --- Axes + labels + bbox ---
  const axesGroup = new THREE.Group();
  axesGroup.name = 'axes';
  const pad = 1;
  const makeLine = (a, b, hex) => {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
    return new THREE.Line(g, new THREE.LineBasicMaterial({ color: hex }));
  };
  axesGroup.add(makeLine([-pad, -pad, -pad], [MAX_X + pad, -pad, -pad], axes.x.color));
  axesGroup.add(makeLine([-pad, -pad, -pad], [-pad, MAX_Y + pad, -pad], axes.y.color));
  axesGroup.add(makeLine([-pad, -pad, -pad], [-pad, -pad, MAX_Z + pad], axes.z.color));

  const bboxGeo = new THREE.BoxGeometry(MAX_X + 1, MAX_Y + 1, MAX_Z + 1);
  const bbox = new THREE.LineSegments(
    new THREE.EdgesGeometry(bboxGeo),
    new THREE.LineBasicMaterial({ color: 0x2f3540 })
  );
  bbox.position.set(MAX_X / 2, MAX_Y / 2, MAX_Z / 2);
  axesGroup.add(bbox);

  // Scale labels to the cube size — clamped so they're readable on tiny
  // cubes (e.g. STL/BLK/TOV ~12 units) without dominating big ones.
  const maxDim = Math.max(MAX_X, MAX_Y, MAX_Z);
  const labelHeight = Math.min(14, Math.max(1.2, maxDim * 0.10));
  const labelOffset = labelHeight * 0.4;
  const labelX = makeLabel(axes.x.label, axes.x.color, labelHeight);
  const labelY = makeLabel(axes.y.label, axes.y.color, labelHeight);
  const labelZ = makeLabel(axes.z.label, axes.z.color, labelHeight);
  labelX.position.set(MAX_X + pad + labelOffset, -pad, -pad);
  labelY.position.set(-pad, MAX_Y + pad + labelOffset, -pad);
  labelZ.position.set(-pad, -pad, MAX_Z + pad + labelOffset);
  const labelOrigin = makeLabel('0,0,0', '#8b94a0', labelHeight * 0.6);
  labelOrigin.position.set(-pad - labelOffset * 0.5, -pad - labelOffset * 0.5, -pad - labelOffset * 0.5);
  axesGroup.add(labelX, labelY, labelZ, labelOrigin);
  cubeGroup.add(axesGroup);
  axesGroup.visible = document.getElementById('showAxes').checked;

  // --- Frame camera to fit the new cube ---
  const cx = MAX_X / 2, cy = MAX_Y / 2, cz = MAX_Z / 2;
  controls.target.set(cx, cy, cz);
  const r0 = Math.max(MAX_X, MAX_Y, MAX_Z, 10) * 1.8;
  camera.position.set(cx + r0 * 0.9, cy + r0 * 0.7, cz + r0 * 1.1);
  camera.lookAt(cx, cy, cz);
  controls.update();

  // --- Lazy zero mesh: rebuild if currently toggled on ---
  const showZeros = document.getElementById('showZeros').checked;
  if (showZeros) buildZeroMesh();

  applyPeel();
  applyOpacity(parseFloat(globalAlphaEl.value));

  statusEl.textContent =
    `${cells.length.toLocaleString()} occupied cells · bbox ${MAX_X}×${MAX_Y}×${MAX_Z}`;
}

function buildZeroMesh() {
  if (state.zeroMesh || !state.occupied) return;
  const { MAX_X, MAX_Y, MAX_Z, occupied } = state;
  const total = (MAX_X + 1) * (MAX_Y + 1) * (MAX_Z + 1) - state.instanceIndex.length;
  if (total <= 0) return;

  // Collect, then sort by distance ascending — keeps peel consistent with occ mesh.
  const positions = [];
  for (let p = 0; p <= MAX_X; p++) {
    for (let r = 0; r <= MAX_Y; r++) {
      for (let a = 0; a <= MAX_Z; a++) {
        if (occupied.has(`${p},${r},${a}`)) continue;
        positions.push([p, r, a]);
      }
    }
  }
  positions.sort((q1, q2) =>
    (q1[0]*q1[0] + q1[1]*q1[1] + q1[2]*q1[2]) -
    (q2[0]*q2[0] + q2[1]*q2[1] + q2[2]*q2[2])
  );

  const geomZ = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  const matZ = new THREE.MeshLambertMaterial({ color: COLOR_ZERO });
  patchMaterial(matZ, 0.18, /* alwaysTransparent */ true);

  const zeroMesh = new THREE.InstancedMesh(geomZ, matZ, positions.length);
  const dummy = new THREE.Object3D();
  const zeroIndex = [];
  for (let i = 0; i < positions.length; i++) {
    const [p, r, a] = positions[i];
    dummy.position.set(p, r, a);
    dummy.updateMatrix();
    zeroMesh.setMatrixAt(i, dummy.matrix);
    zeroIndex.push({ p, r, a });
  }
  zeroMesh.count = positions.length;
  zeroMesh.instanceMatrix.needsUpdate = true;
  zeroMesh.renderOrder = -1;
  cubeGroup.add(zeroMesh);
  state.zeroMesh = zeroMesh;
  state.zeroIndex = zeroIndex;
  applyPeel();
}

// ---- Picking ----
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(event) {
  if (!state.occMesh) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const targets = [state.occMesh];
  if (state.zeroMesh && state.zeroMesh.visible) targets.push(state.zeroMesh);
  const hits = raycaster.intersectObjects(targets, false);
  return hits[0] || null;
}

function fmtAxis(c) {
  const a = state.axes;
  return `${c.p} ${a.x.label.toLowerCase()} · ${c.r} ${a.y.label.toLowerCase()} · ${c.a} ${a.z.label.toLowerCase()}`;
}

function showDetailForCell(c) {
  detailEl.style.display = 'block';
  detailBodyEl.innerHTML = `
    <div class="pra">${fmtAxis(c)}</div>
    <div class="row"><span class="k">tally</span><span class="v">${c.n.toLocaleString()}</span></div>
    <div class="row"><span class="k">most recent</span><span class="v">${c.d || '—'}</span></div>
    <div class="row"><span class="k">player</span><span class="v">${c.pl || 'unknown'} ${c.t ? '(' + c.t + ')' : ''}</span></div>
    <div class="row"><span class="k">matchup</span><span class="v">${c.m || '—'}</span></div>
    <div class="row"><span class="k">game id</span><span class="v">${c.g || '—'}</span></div>
  `;
}
function showDetailForZero(p, r, a) {
  detailEl.style.display = 'block';
  detailBodyEl.innerHTML = `
    <div class="pra">${fmtAxis({ p, r, a })}</div>
    <div class="empty">no player has ever recorded this exact stat line</div>
  `;
}

renderer.domElement.addEventListener('mousemove', (ev) => {
  const hit = pick(ev);
  if (!hit) { clearHover(); renderer.domElement.style.cursor = 'default'; return; }
  setHover(hit.object, hit.instanceId);
  renderer.domElement.style.cursor = 'pointer';
});

let dragStart = null;
renderer.domElement.addEventListener('mousedown', (ev) => { dragStart = { x: ev.clientX, y: ev.clientY }; });
renderer.domElement.addEventListener('mouseup', (ev) => {
  if (!dragStart) return;
  const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
  dragStart = null;
  if (dx * dx + dy * dy > 16) return;
  const hit = pick(ev);
  if (!hit) return;
  if (hit.object === state.occMesh) showDetailForCell(state.instanceIndex[hit.instanceId]);
  else if (hit.object === state.zeroMesh) {
    const z = state.zeroIndex[hit.instanceId];
    showDetailForZero(z.p, z.r, z.a);
  }
});

// ---- UI bindings ----
document.getElementById('showZeros').addEventListener('change', (e) => {
  if (e.target.checked) {
    buildZeroMesh();
    if (state.zeroMesh) state.zeroMesh.visible = true;
  } else if (state.zeroMesh) {
    state.zeroMesh.visible = false;
  }
});
const globalAlphaEl = document.getElementById('globalAlpha');
const globalAlphaNumEl = document.getElementById('globalAlphaNum');
function applyOpacity(v) {
  SHARED.uGlobalOpacity.value = v;
  globalAlphaNumEl.textContent = v.toFixed(2);
  // Flip occupied voxels in/out of the transparent render path so they
  // properly occlude each other at full opacity.
  if (state.occMesh) {
    const wantsTransparent = v < 0.999;
    const mat = state.occMesh.material;
    if (mat.transparent !== wantsTransparent) {
      mat.transparent = wantsTransparent;
      mat.depthWrite = !wantsTransparent;
      mat.needsUpdate = true;
    }
  }
}
globalAlphaEl.addEventListener('input', () => {
  applyOpacity(parseFloat(globalAlphaEl.value));
});
const peelEl = document.getElementById('peel');
const peelNumEl = document.getElementById('peelNum');

function applyPeel() {
  const v = parseFloat(peelEl.value);
  const keepFrac = 1 - v;
  if (state.occMesh) {
    const total = state.instanceIndex.length;
    state.occMesh.count = Math.max(0, Math.min(total, Math.round(total * keepFrac)));
  }
  if (state.zeroMesh) {
    const total = state.zeroIndex.length;
    state.zeroMesh.count = Math.max(0, Math.min(total, Math.round(total * keepFrac)));
  }
}

peelEl.addEventListener('input', () => {
  peelNumEl.textContent = parseFloat(peelEl.value).toFixed(2);
  applyPeel();
});
document.getElementById('showAxes').addEventListener('change', (e) => {
  const a = cubeGroup.getObjectByName('axes');
  if (a) a.visible = e.target.checked;
});

// ---- Data loading (static) ----
// Each combo is precomputed into tally/<a>_<b>_<c>.json with keys sorted
// alphabetically. When the user picks a different X/Y/Z order, we remap.
const STATS_META = {};

async function loadStats() {
  const r = await fetch('stats.json');
  if (!r.ok) throw new Error('GET stats.json: ' + r.status);
  const stats = (await r.json()).stats;
  for (const s of stats) STATS_META[s.key] = s;
  return stats;
}

async function loadTally(x, y, z) {
  const fileKeys = [x, y, z].slice().sort();
  const url = `tally/${fileKeys.join('_')}.json`;
  statusEl.textContent = `loading ${x}/${y}/${z}...`;
  const r = await fetch(url);
  if (!r.ok) {
    const body = await r.text();
    throw new Error(`GET ${url}: ${r.status} ${body}`);
  }
  const data = await r.json();

  // Remap canonical-alphabetical cells/axes into the user's chosen order.
  const userKeys = [x, y, z];
  const map = userKeys.map(k => fileKeys.indexOf(k));   // user axis -> file axis
  const fileMaxes = [data.axes.x.max, data.axes.y.max, data.axes.z.max];

  const mkAxis = (k, idx) => ({
    key: k,
    label: STATS_META[k].label,
    color: STATS_META[k].color,
    max: fileMaxes[idx],
  });
  const axes = {
    x: mkAxis(userKeys[0], map[0]),
    y: mkAxis(userKeys[1], map[1]),
    z: mkAxis(userKeys[2], map[2]),
  };

  const cells = data.cells.map(c => {
    const v = [c.p, c.r, c.a];
    return {
      p: v[map[0]], r: v[map[1]], a: v[map[2]],
      n: c.n, d: c.d, pl: c.pl, t: c.t, m: c.m, g: c.g,
    };
  });

  return { axes, cells, leaderboard: data.leaderboard };
}

function fillDropdowns(stats, defaults) {
  const els = [axisXEl, axisYEl, axisZEl];
  els.forEach((el, i) => {
    el.innerHTML = stats.map(s => `<option value="${s.key}">${s.label}</option>`).join('');
    el.value = defaults[i];
  });
}

function currentAxes() {
  return [axisXEl.value, axisYEl.value, axisZEl.value];
}

async function refresh() {
  const [x, y, z] = currentAxes();
  // Prevent duplicates: bump dupe to a different stat from the dropdown order
  const set = new Set([x, y, z]);
  if (set.size !== 3) {
    statusEl.textContent = 'pick three distinct stats';
    return;
  }
  try {
    const data = await loadTally(x, y, z);
    buildCube(data);
    lbListEl.innerHTML = (data.leaderboard || []).map((p, i) =>
      `<div class="lbRow"><span class="rk">${i + 1}</span><span class="nm">${p.name}</span><span class="ct">${p.n}</span></div>`
    ).join('') || '<div class="hint">no n=1 cells</div>';
    lbHintEl.textContent = `Most unique ${data.axes.x.label}/${data.axes.y.label}/${data.axes.z.label} lines (n=1)`;
    axisHintEl.textContent = `${data.axes.x.label} × ${data.axes.y.label} × ${data.axes.z.label}`;
    detailEl.style.display = 'none';
  } catch (err) {
    statusEl.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
}

// Avoid duplicate selection by auto-rotating the others
function enforceDistinct(changed) {
  const els = [axisXEl, axisYEl, axisZEl];
  const vals = els.map(e => e.value);
  const dupIdx = vals.findIndex((v, i) => i !== changed && v === vals[changed]);
  if (dupIdx === -1) return;
  // Pick a value not in vals
  const used = new Set(vals);
  for (const opt of els[dupIdx].options) {
    if (!used.has(opt.value)) { els[dupIdx].value = opt.value; return; }
  }
}

axisXEl.addEventListener('change', () => { enforceDistinct(0); refresh(); });
axisYEl.addEventListener('change', () => { enforceDistinct(1); refresh(); });
axisZEl.addEventListener('change', () => { enforceDistinct(2); refresh(); });

(async () => {
  try {
    const stats = await loadStats();
    fillDropdowns(stats, ['pts', 'reb', 'ast']);
    await refresh();
  } catch (err) {
    statusEl.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
})();

function animate() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
