const NBA_TO_BBR_TEAM = {
  BKN: 'BRK', PHX: 'PHO', GOS: 'GSW', SAN: 'SAS', UTH: 'UTA',
  PHL: 'PHI', MIH: 'MLH', BAL: 'BLB', BLT: 'BAL',
};
// Same NBA-API abbr, different BBR code depending on era.
const NBA_BBR_ERA = {
  CHA: [['2014-07', 'CHA'], ['9999', 'CHO']],
  WAS: [['1997-07', 'WSB'], ['9999', 'WAS']],
  KCK: [['1975-07', 'KCO'], ['9999', 'KCK']],
};
const WNBA_TO_BBR_TEAM = { SAN: 'SAS', PHX: 'PHO', PDX: 'POR' };
const NBA_LEGACY_ABBR = { GOS: 'GSW', PHL: 'PHI', SAN: 'SAS', UTH: 'UTA', BLT: 'BAL' };
const dispAbbr = a => (SPORT === 'nba' && a && NBA_LEGACY_ABBR[a]) || a;
const dispMatchup = m => (SPORT === 'nba' && m)
  ? m.replace(/[A-Z]{2,3}/g, x => NBA_LEGACY_ABBR[x] || x) : m;
const NFL_TO_PFR_TEAM = {
  KC: 'kan', NE: 'nwe', NO: 'nor', TB: 'tam', GB: 'gnb', SF: 'sfo',
  LV: 'rai', LAR: 'ram', LAC: 'sdg', LA: 'ram',
  ARI: 'crd', BAL: 'rav', TEN: 'oti', IND: 'clt', HOU: 'htx',
  STL: 'ram', SD: 'sdg', OAK: 'rai',
};

function playerUrl(cell) {
  if (!cell || cell.pid == null) return null;
  if (SPORT === 'nba') return `https://www.nba.com/player/${cell.pid}`;
  if (SPORT === 'wnba') return `https://www.wnba.com/player/${cell.pid}`;
  if (SPORT === 'mlb') return `https://www.mlb.com/player/${cell.pid}`;
  if (SPORT === 'nhl') return `https://www.nhl.com/player/${cell.pid}`;
  if (SPORT === 'nfl') {
    const id = String(cell.pid);
    if (/^[A-Za-z]/.test(id) && !id.includes('-')) {
      return `https://www.pro-football-reference.com/players/${id[0].toUpperCase()}/${id}.htm`;
    }
  }
  return null;
}

function seasonBoxscoresUrl(cell) {
  if (!cell || cell.pid == null || !cell.d) return null;
  const st = 'Regular%20Season';
  if (SPORT === 'wnba') return `https://stats.wnba.com/player/${cell.pid}/boxscores-traditional/?Season=${cell.d}&SeasonType=${st}`;
  if (SPORT === 'nba')  return `https://www.nba.com/stats/player/${cell.pid}/boxscores-traditional?Season=${cell.d}&SeasonType=${st}`;
  return null;
}

function playerLinkUrl(cell) {
  if (MODE === 'season') {
    const u = seasonBoxscoresUrl(cell);
    if (u) return u;
  }
  return playerUrl(cell);
}

function playerHtml(cell, suffix) {
  const name = (cell.pl || 'Unknown') + (suffix || '');
  const url = playerLinkUrl(cell);
  return url
    ? `<a href="${url}" target="_blank" rel="noopener" style="color:#e6e8eb">${name} ↗</a>`
    : name;
}

function boxscoreUrl(cell) {
  if (!cell || !cell.d) return null;
  const ymd = cell.d.replaceAll('-', '');
  if (SPORT === 'nba' || SPORT === 'wnba') {
    if (!cell.m) return null;
    let home;
    if (cell.m.includes(' @ ')) home = cell.m.split(' @ ')[1].trim();
    else if (cell.m.includes(' vs. ') || cell.m.includes(' vs ')) {
      home = cell.m.split(/ vs\.? /)[0].trim();
    } else return null;
    const wnba = SPORT === 'wnba';
    if (!wnba && NBA_BBR_ERA[home]) home = NBA_BBR_ERA[home].find(([end]) => cell.d < end)[1];
    else home = (wnba ? WNBA_TO_BBR_TEAM : NBA_TO_BBR_TEAM)[home] || home;
    return `https://www.basketball-reference.com/${wnba ? 'wnba/' : ''}boxscores/${ymd}0${home}.html`;
  }
  if (SPORT === 'nfl') {
    if (!cell.g) return null;
    if (/^\d{8}0[a-z]{3}$/i.test(cell.g)) {
      return `https://www.pro-football-reference.com/boxscores/${cell.g.toLowerCase()}.htm`;
    }
    const parts = cell.g.split('_');
    if (parts.length !== 4) return null;
    const home = parts[3];
    const pfr = NFL_TO_PFR_TEAM[home] || home.toLowerCase();
    return `https://www.pro-football-reference.com/boxscores/${ymd}0${pfr}.htm`;
  }
  if (SPORT === 'mlb') {
    return cell.g ? `https://www.mlb.com/gameday/${cell.g}/final/box` : null;
  }
  if (SPORT === 'nhl') {
    return cell.g ? `https://www.nhl.com/gamecenter/${cell.g}` : null;
  }
  return null;
}
let SPORT = null;
let MODE = 'game';
let MIN_GAMES = true;
const HAS_MIN_GAMES = new Set(['nba', 'nfl', 'wnba', 'nhl']);
let QUALIFIED = true;
const HAS_QUALIFIER = new Set(['mlb']);
const QUALIFIER_TIP = 'Min 150 PA / 50 IP, keeps rate stats off tiny samples';
let SEASON_TOTALS = true;
const HAS_SEASON_AVG = new Set(['nfl', 'nhl']);
const USES_BINARY = new Set(['nba', 'wnba', 'nfl', 'mlb', 'nhl']);
const DUMP_V = '?v=2';
const STATS_META = {};

let POSITION = 'all';
let GROUP = 'off';
let WL_W = true, WL_L = true;
let PO_REG = true, PO_PLAYOFF = true;
const DUMP_CACHE = {};
const MLB_POS_PRIMARY = [['all', 'All'], ['p', 'P'], ['pos', 'POS']];
const MLB_POS_FIELD = [
  ['c', 'C'], ['1b', '1B'], ['2b', '2B'], ['3b', '3B'], ['ss', 'SS'],
  ['lf', 'LF'], ['cf', 'CF'], ['rf', 'RF'], ['dh', 'DH'],
];
const MLB_FULL_POS = new Set(['all', 'p']);

function qualDomains(x, y, z) {
  if (!QUALIFIED || MODE !== 'season') return null;
  const d = {};
  for (const k of [x, y, z]) {
    const q = STATS_META[k] && STATS_META[k].qual;
    if (q) d[q] = true;
  }
  return (d.bat || d.pit) ? d : null;
}

function wlFilterValue() {
  if (WL_W && WL_L) return null;
  if (WL_W) return 1;
  if (WL_L) return 0;
  return -1;
}

function poFilterValue() {
  if (PO_REG && PO_PLAYOFF) return null;
  if (PO_PLAYOFF) return 1;
  if (PO_REG) return 0;
  return -1;
}

function computeRecentsColumnar(cell) {
  const ctx = state.recentCtx, { dump, ix, iy, iz, game, wlFilter, qual, minGames, poFilter, dz0, dz1, dz2 } = ctx;
  const { v, nAxes, N, recOff, vNull } = dump, k = COARSE;
  const occ = [];
  for (let i = 0; i < N; i++) {
    if (!lineKept(dump, i, wlFilter, qual, minGames, poFilter)) continue;
    const b = i * nAxes, vx = v[b + ix], vy = v[b + iy], vz = v[b + iz];
    if (vx === vNull || vy === vNull || vz === vNull) continue;
    if ((dz0 && vx === 0) || (dz1 && vy === 0) || (dz2 && vz === 0)) continue;
    if (ctx.iw >= 0 && v[b + ctx.iw] !== cell.w4) continue;
    if (Math.floor(vx / k) !== cell.p || Math.floor(vy / k) !== cell.r || Math.floor(vz / k) !== cell.a) continue;
    for (let j = recOff[i], e = recOff[i + 1]; j < e; j++) occ.push(j);
  }
  occ.sort((j, l) => cmpOcc(dump, j, l, game));
  return occ.slice(0, 5).map(j => occToRecent(dump, j, game));
}

function computeRecents(cell) {
  const ctx = state.recentCtx;
  if (!ctx) return [];
  if (ctx.columnar) return computeRecentsColumnar(cell);
  const { dump, ix, iy, iz, game, cmp, wlFilter, qual, minGames, poFilter, dz0, dz1, dz2 } = ctx;
  const k = COARSE;
  const occ = [];
  for (const ln of dump.lines) {
    if (wlFilter != null && ln.w !== wlFilter) continue;
    if (poFilter != null && ln.po !== poFilter) continue;
    if (qual && ((qual.bat && !ln.qb) || (qual.pit && !ln.qp))) continue;
    if (minGames && ln.q !== 1) continue;
    const vx = ln.v[ix], vy = ln.v[iy], vz = ln.v[iz];
    if (vx == null || vy == null || vz == null) continue;
    if ((dz0 && vx === 0) || (dz1 && vy === 0) || (dz2 && vz === 0)) continue;
    if (ctx.iw >= 0 && ln.v[ctx.iw] !== cell.w4) continue;
    if (Math.floor(vx / k) !== cell.p || Math.floor(vy / k) !== cell.r
        || Math.floor(vz / k) !== cell.a) continue;
    for (const o of ln.r) occ.push(o);
  }
  const top5 = occ.sort(cmp).slice(0, 5);
  return game
    ? top5.map(o => ({ pl: o[1], d: o[5], t: o[2], m: o[3], g: o[4], pid: o[0], w: o[6] }))
    : top5.map(o => ({ pl: o[1], d: o[2], gp: o[3], pid: o[0] }));
}

function dumpBase() {
  return SPORT === 'mlb' ? `mlb/${POSITION}` : sportBase();
}

function takeEarly(kind, url) {
  const e = window.__early, s = e && e[kind];
  if (!s || s.url !== url) return null;
  e[kind] = null;
  return s.p;
}

function getDump(quiet) {
  const mode = MODE !== 'season' ? 'game'
    : (HAS_SEASON_AVG.has(SPORT) && !SEASON_TOTALS) ? 'season-avg' : 'season';
  const base = dumpBase();
  const key = `${base}/${mode}`;
  if (!DUMP_CACHE[key]) {
    const bin = USES_BINARY.has(SPORT);
    const url = `${base}/${mode}.${bin ? 'bin' : 'json'}.br${DUMP_V}`;
    if (!quiet) statusEl.textContent = `loading ${SPORTS[SPORT].label} ${mode} data…`;
    const p = (async () => {
      let r = takeEarly('dump', url);
      r = r && await r;
      if (!r) r = await fetch(url);
      if (!r.ok) throw new Error(`GET ${url}: ${r.status}`);
      try {
        return bin ? decodeBinary(await r.arrayBuffer()) : await r.json();
      } catch {
        // a cache (CDN or browser) served garbage; refetch straight from network
        r = await fetch(url, { cache: 'reload' });
        if (!r.ok) throw new Error(`GET ${url}: ${r.status}`);
        return bin ? decodeBinary(await r.arrayBuffer()) : await r.json();
      }
    })();
    p.catch(() => { if (DUMP_CACHE[key] === p) delete DUMP_CACHE[key]; });
    DUMP_CACHE[key] = p;
  }
  return DUMP_CACHE[key];
}

function sportBase() {
  return SPORTS[SPORT].groups ? `${SPORT}/${GROUP}` : SPORT;
}

let prefetchRun = 0;
function prefetchSiblings() {
  const token = ++prefetchRun;
  const conn = navigator.connection;
  if (conn && (conn.saveData || /(^|-)2g$/.test(conn.effectiveType || ''))) return;
  const sport = SPORT, mode = 'game';
  let bases;
  if (sport === 'mlb') {
    bases = [...MLB_POS_PRIMARY, ...MLB_POS_FIELD]
      .map(([k]) => `mlb/${k}`).filter(b => b !== `mlb/${POSITION}`);
  } else if (SPORTS[sport].groups) {
    bases = SPORTS[sport].groups
      .map(([k]) => `${sport}/${k}`).filter(b => b !== `${sport}/${GROUP}`);
  } else return;
  const idle = window.requestIdleCallback
    ? (fn => requestIdleCallback(fn, { timeout: 1200 }))
    : (fn => setTimeout(fn, 400));
  let i = 0;
  const step = () => {
    if (token !== prefetchRun || SPORT !== sport) return;
    if (i >= bases.length) return;
    const key = `${bases[i++]}/${mode}`;
    if (DUMP_CACHE[key]) return idle(step);
    const bin = USES_BINARY.has(sport);
    fetch(`${key}.${bin ? 'bin' : 'json'}.br${DUMP_V}`)
      .then(r => (r.ok ? (bin ? r.arrayBuffer().then(decodeBinary) : r.json()) : null))
      .then(d => { if (d && token === prefetchRun) DUMP_CACHE[key] = d; })
      .catch(() => {})
      .finally(() => idle(step));
  };
  idle(step);
}

async function loadStats() {
  const url = ((SPORT === 'mlb')
    ? `mlb/${POSITION}/${MODE === 'season' ? 'stats-season' : 'stats'}.json`
    : `${sportBase()}/stats.json`) + DUMP_V;
  let r = takeEarly('stats', url);
  r = r && await r;
  if (!r) r = await fetch(url);
  if (!r.ok) throw new Error(`GET ${url}: ` + r.status);
  const stats = (await r.json()).stats;
  for (const k of Object.keys(STATS_META)) delete STATS_META[k];
  for (const s of stats) STATS_META[s.key] = s;
  return stats;
}

async function loadTally(x, y, z) {
  const dump = await getDump();
  const wl = (SPORT === 'mlb' && MODE !== 'season' && MLB_FULL_POS.has(POSITION))
    ? wlFilterValue() : null;
  const qual = SPORT === 'mlb' ? qualDomains(x, y, z) : null;
  const minGames = SPORT !== 'mlb' && MODE === 'season'
    && MIN_GAMES && HAS_MIN_GAMES.has(SPORT);
  const po = (MODE === 'season' || SPORT !== 'mlb' || MLB_FULL_POS.has(POSITION))
    ? poFilterValue() : null;
  const wKey = (axisWEl.value && ![x, y, z].includes(axisWEl.value)) ? axisWEl.value : null;
  const r = rollupCube(dump, x, y, z, wl, qual, minGames, po, wKey);
  state.recentCtx = r.recentCtx;
  const mkAxis = (k, max) => ({
    key: k, label: STATS_META[k].label, color: STATS_META[k].color, max,
  });
  const axes = { x: mkAxis(x, r.axes.x.max), y: mkAxis(y, r.axes.y.max), z: mkAxis(z, r.axes.z.max) };
  if (wKey) {
    const fresh = !cube4D || cube4D.wKey !== wKey;
    cube4D = { cells: r.cells, axes, wKey, wMin: r.w.min, wMax: r.w.max, gen: ++cubeGen };
    lbSliceLabelEl.style.display = '';
    return { axes, cells: sliceW(fresh) };
  }
  cube4D = null;
  wRowEl.style.display = 'none';
  lbSliceLabelEl.style.display = 'none';
  return { axes, cells: r.cells };
}

function sliceW(fresh) {
  const { cells, wKey, wMin, wMax } = cube4D;
  wSliderEl.min = wMin;
  wSliderEl.max = wMax;
  let v = fresh ? wMin : parseInt(wSliderEl.value, 10);
  if (!Number.isFinite(v)) v = wMin;
  v = Math.max(wMin, Math.min(wMax, v));
  wSliderEl.value = v;
  wReadoutEl.textContent = `${STATS_META[wKey].label} = ${fmtStat(wKey, v)}`;
  wRowEl.style.display = 'flex';
  return cells.filter(c => c.w4 === v);
}

function wHintSuffix() {
  return cube4D
    ? ` @ ${STATS_META[cube4D.wKey].label} = ${fmtStat(cube4D.wKey, parseInt(wSliderEl.value, 10))}`
    : '';
}

async function fastDefaultRender() {
  const [x, y, z] = [axisXEl.value, axisYEl.value, axisZEl.value];
  const url = `${dumpBase()}/default.json.br${DUMP_V}`;
  try {
    let r = takeEarly('cells', url);
    r = r && await r;
    if (!r) r = await fetch(url);
    if (!r.ok) return false;
    const d = await r.json();
    if (d.axes.x.key !== x || d.axes.y.key !== y || d.axes.z.key !== z) return false;
    const mk = (a) => ({ key: a.key, label: STATS_META[a.key].label,
                         color: STATS_META[a.key].color, max: a.max });
    rawData = { axes: { x: mk(d.axes.x), y: mk(d.axes.y), z: mk(d.axes.z) }, cells: d.cells };
    state.recentCtx = null;
    renderCube();
    lbHintEl.textContent = `Most Unique ${rawData.axes.x.label}/${rawData.axes.y.label}/${rawData.axes.z.label} Lines`;
    axisHintEl.textContent = `${rawData.axes.x.label} × ${rawData.axes.y.label} × ${rawData.axes.z.label}`;
    detailEl.style.display = 'none';
    lastAxes = [x, y, z];
    return true;
  } catch { return false; }
}

let lastAxes = [];

function fillDropdowns(stats, defaults) {
  const els = [axisXEl, axisYEl, axisZEl];
  els.forEach((el, i) => {
    el.innerHTML = stats.map(s => `<option value="${s.key}">${s.label}</option>`).join('');
    el.value = defaults[i];
  });
  axisWEl.innerHTML = '<option value="">Off</option>'
    + stats.map(s => `<option value="${s.key}">${s.label}</option>`).join('');
  axisWEl.value = '';
  cube4D = null;
  wSliderEl.value = '';
  wRowEl.style.display = 'none';
  lbSliceLabelEl.style.display = 'none';
  lastAxes = defaults.slice();
}

async function refresh() {
  const [x, y, z] = [axisXEl.value, axisYEl.value, axisZEl.value];
  const set = new Set([x, y, z]);
  if (set.size !== 3) {
    statusEl.textContent = 'pick three distinct stats';
    return;
  }
  if (axisWEl.value && set.has(axisWEl.value)) axisWEl.value = '';
  try {
    const data = await loadTally(x, y, z);
    rawData = data;
    renderCube();
    updateAxisHints();
    detailEl.style.display = 'none';
    lastAxes = [x, y, z];
  } catch (err) {
    statusEl.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
}

function enforceDistinct(changed) {
  const els = [axisXEl, axisYEl, axisZEl];
  const vals = els.map(e => e.value);
  const dupIdx = vals.findIndex((v, i) => i !== changed && v === vals[changed]);
  if (dupIdx === -1) return;
  const prev = lastAxes[changed];
  if (prev && prev !== vals[changed]) {
    els[dupIdx].value = prev;
    return;
  }
  const used = new Set(vals);
  for (const opt of els[dupIdx].options) {
    if (!used.has(opt.value)) { els[dupIdx].value = opt.value; return; }
  }
}

axisXEl.addEventListener('change', () => { enforceDistinct(0); refresh(); });
axisYEl.addEventListener('change', () => { enforceDistinct(1); refresh(); });
axisZEl.addEventListener('change', () => { enforceDistinct(2); refresh(); });
axisWEl.addEventListener('change', refresh);

function updateAxisHints() {
  if (!rawData) return;
  const a = rawData.axes;
  if (cube4D && lbSliceEl.checked) {
    lbHintEl.textContent = `Most Unique ${a.x.label}/${a.y.label}/${a.z.label} Lines` + wHintSuffix();
  } else {
    const w4 = cube4D ? `/${STATS_META[cube4D.wKey].label}` : '';
    lbHintEl.textContent = `Most Unique ${a.x.label}/${a.y.label}/${a.z.label}${w4} Lines`;
  }
  axisHintEl.textContent = `${a.x.label} × ${a.y.label} × ${a.z.label}` + wHintSuffix();
}

wSliderEl.addEventListener('input', () => {
  if (!cube4D) return;
  rawData = { axes: cube4D.axes, cells: sliceW() };
  renderCube(true);
  updateAxisHints();
  detailEl.style.display = 'none';
});
lbSliceEl.addEventListener('change', () => {
  updateAxisHints();
  recomputeLeaderboard();
});

let sportLoading = false;
let sportLoadFailed = false;

async function loadSport(sport) {
  if (!SPORTS[sport] || (sport === SPORT && !sportLoadFailed) || sportLoading) return;
  sportLoading = true;
  try {
    await loadSportInner(sport);
  } finally {
    sportLoading = false;
  }
}

async function loadSportInner(sport) {
  sportLoadFailed = false;
  SPORT = sport;
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.sport === sport);
  });
  location.hash = `sport=${sport}`;
  for (const s of Object.keys(SPORTS)) {
    document.body.classList.toggle(`sport-${s}`, s === sport);
  }
  MODE = 'game';
  MIN_GAMES = true;
  QUALIFIED = true;
  SEASON_TOTALS = true;
  PO_REG = PO_PLAYOFF = true;
  COARSE = 1;
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === 'game'));
  document.querySelectorAll('#coarseToggle button').forEach(x =>
    x.classList.toggle('active', x.dataset.k === '1'));
  updateMinGamesToggle();
  blockedPlayers.clear();
  refreshBlockedLower();
  renderPlayerChips();
  reversePlayerFilter = false;
  const revBtn = document.getElementById('playerFilterReverse');
  revBtn.classList.remove('active');
  revBtn.textContent = 'Reverse';
  document.getElementById('yearFrom').value = '';
  document.getElementById('yearTo').value = '';
  pinnedYears.clear();
  renderYearChips();
  const isMlb = sport === 'mlb';
  const grouped = !!SPORTS[sport].groups;
  document.getElementById('posBar').style.display = 'flex';
  if (isMlb) { POSITION = 'all'; WL_W = WL_L = true; buildPosBar(); }
  else if (grouped) { GROUP = SPORTS[sport].groups[0][0]; buildGroupBar(); }
  else buildPoBar();
  try {
    statusEl.textContent = `loading ${SPORTS[sport].label} ...`;
    const stats = await loadStats();
    fillDropdowns(stats, isMlb ? mlbAxisDefaults(stats)
                               : grouped ? SPORTS[sport].groupDefaults[GROUP]
                                         : SPORTS[sport].defaults);
    if (await fastDefaultRender()) {
      const s = sport;
      getDump(true).then(d => {
        if (SPORT === s && MODE === 'game' && !state.recentCtx)
          state.recentCtx = makeRecentCtx(d, axisXEl.value, axisYEl.value, axisZEl.value, null, null, false, null);
      }).catch(() => {}).finally(() => prefetchSiblings());
    } else {
      await refresh();
      prefetchSiblings();
    }
  } catch (err) {
    sportLoadFailed = true;
    statusEl.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
}

document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => loadSport(b.dataset.sport));
});

function buildPosBar() {
  const bar = document.getElementById('posBar');
  const posBtn = ([k, l]) =>
    `<button data-pos="${k}" class="${k === POSITION ? 'active' : ''}">${l}</button>`;
  let html = MLB_POS_PRIMARY.map(posBtn).join('')
    + '<span class="pos-sep"></span>' + MLB_POS_FIELD.map(posBtn).join('');
  if (MLB_FULL_POS.has(POSITION) && MODE !== 'season') {
    html += '<span class="pos-sep"></span>'
      + `<button data-wl="W" class="${WL_W ? 'active' : ''}">W</button>`
      + `<button data-wl="L" class="${WL_L ? 'active' : ''}">L</button>`;
  }
  if (MODE === 'season' || MLB_FULL_POS.has(POSITION)) {
    html += '<span class="pos-sep"></span>' + poButtonsHtml();
  }
  bar.innerHTML = html;
  bar.querySelectorAll('button[data-pos]').forEach(b =>
    b.addEventListener('click', () => setPosition(b.dataset.pos)));
  bar.querySelectorAll('button[data-wl]').forEach(b =>
    b.addEventListener('click', () => setWl(b.dataset.wl)));
  wirePoButtons(bar);
}

function buildGroupBar() {
  const bar = document.getElementById('posBar');
  bar.innerHTML = SPORTS[SPORT].groups.map(([k, l]) =>
    `<button data-group="${k}" class="${k === GROUP ? 'active' : ''}">${l}</button>`
  ).join('') + '<span class="pos-sep"></span>' + poButtonsHtml();
  bar.querySelectorAll('button[data-group]').forEach(b =>
    b.addEventListener('click', () => setGroup(b.dataset.group)));
  wirePoButtons(bar);
}

function buildPoBar() {
  const bar = document.getElementById('posBar');
  bar.innerHTML = poButtonsHtml();
  wirePoButtons(bar);
}

function groupAxisDefaults(stats) {
  const keys = new Set(stats.map(s => s.key));
  const cur = [axisXEl.value, axisYEl.value, axisZEl.value];
  if (cur.every(k => keys.has(k)) && new Set(cur).size === 3) return cur;
  const pick = (SPORTS[SPORT].groupDefaults[GROUP] || []).filter(k => keys.has(k));
  for (const s of stats) { if (pick.length >= 3) break; if (!pick.includes(s.key)) pick.push(s.key); }
  return pick.slice(0, 3);
}

async function setGroup(group) {
  if (group === GROUP) return;
  GROUP = group;
  buildGroupBar();
  try {
    const stats = await loadStats();
    fillDropdowns(stats, groupAxisDefaults(stats));
    await refresh();
  } catch (err) { statusEl.textContent = 'ERROR: ' + err.message; console.error(err); }
}

function setWl(which) {
  if (which === 'W') WL_W = !WL_W; else WL_L = !WL_L;
  document.querySelector('#posBar button[data-wl="W"]').classList.toggle('active', WL_W);
  document.querySelector('#posBar button[data-wl="L"]').classList.toggle('active', WL_L);
  refresh();
}

function mlbAxisDefaults(stats) {
  const keys = new Set(stats.map(s => s.key));
  const cur = [axisXEl.value, axisYEl.value, axisZEl.value];
  if (cur.every(k => keys.has(k)) && new Set(cur).size === 3) return cur;
  const pick = SPORTS.mlb.defaults.filter(k => keys.has(k));
  for (const s of stats) { if (pick.length >= 3) break; if (!pick.includes(s.key)) pick.push(s.key); }
  return pick.slice(0, 3);
}

async function reloadMlbAxes() {
  try {
    const stats = await loadStats();
    fillDropdowns(stats, mlbAxisDefaults(stats));
    buildPosBar();
    await refresh();
  } catch (err) { statusEl.textContent = 'ERROR: ' + err.message; console.error(err); }
}

async function setPosition(pos) {
  if (pos === POSITION) return;
  POSITION = pos;
  WL_W = WL_L = true;
  PO_REG = PO_PLAYOFF = true;
  updatePoToggle();
  buildPosBar();
  await reloadMlbAxes();
}

function updateTotalsToggle() {
  const btn = document.getElementById('totalsToggle');
  btn.style.display =
    (MODE === 'season' && HAS_SEASON_AVG.has(SPORT)) ? 'block' : 'none';
  btn.classList.toggle('active', SEASON_TOTALS);
  btn.textContent = SEASON_TOTALS ? 'Totals' : 'Per Game';
}

document.getElementById('totalsToggle').addEventListener('click', () => {
  SEASON_TOTALS = !SEASON_TOTALS;
  updateTotalsToggle();
  refresh();
});

function poButtonsHtml() {
  return `<button data-po="reg" class="${PO_REG ? 'active' : ''}">Regular</button>`
    + `<button data-po="po" class="${PO_PLAYOFF ? 'active' : ''}">Playoffs</button>`;
}

function wirePoButtons(bar) {
  bar.querySelectorAll('button[data-po]').forEach(b =>
    b.addEventListener('click', () => {
      if (b.dataset.po === 'reg') PO_REG = !PO_REG; else PO_PLAYOFF = !PO_PLAYOFF;
      updatePoToggle();
      refresh();
    }));
}

function updatePoToggle() {
  const r = document.querySelector('#posBar button[data-po="reg"]');
  const p = document.querySelector('#posBar button[data-po="po"]');
  if (r) r.classList.toggle('active', PO_REG);
  if (p) p.classList.toggle('active', PO_PLAYOFF);
}

function updateMinGamesToggle() {
  updateTotalsToggle();
  updatePoToggle();
  const btn = document.getElementById('injuredToggle');
  const isQual = HAS_QUALIFIER.has(SPORT);
  const show = MODE === 'season' && (isQual || HAS_MIN_GAMES.has(SPORT));
  btn.style.display = show ? 'block' : 'none';
  btn.classList.toggle('active', isQual ? QUALIFIED : MIN_GAMES);
  btn.textContent = isQual
    ? `Qualified: ${QUALIFIED ? 'on' : 'off'}`
    : 'Min Games';
  btn.title = isQual ? QUALIFIER_TIP : '';
}

document.querySelectorAll('#modeToggle button').forEach(b => {
  b.addEventListener('click', () => {
    if (MODE === b.dataset.mode) return;
    MODE = b.dataset.mode;
    document.querySelectorAll('#modeToggle button').forEach(x =>
      x.classList.toggle('active', x.dataset.mode === MODE));
    setCoarse(MODE === 'season' && (SPORT === 'mlb' || SPORT === 'nfl' || SPORT === 'nhl') ? 5 : 1);
    updateMinGamesToggle();
    if (SPORT === 'mlb') reloadMlbAxes();
    else refresh();
  });
});

document.getElementById('injuredToggle').addEventListener('click', () => {
  if (HAS_QUALIFIER.has(SPORT)) QUALIFIED = !QUALIFIED;
  else MIN_GAMES = !MIN_GAMES;
  updateMinGamesToggle();
  refresh();
});

function setCoarse(k) {
  COARSE = k;
  document.querySelectorAll('#coarseToggle button').forEach(x =>
    x.classList.toggle('active', parseInt(x.dataset.k, 10) === k));
}

document.querySelectorAll('#coarseToggle button').forEach(b => {
  b.addEventListener('click', () => {
    const k = parseInt(b.dataset.k, 10);
    if (k === COARSE) return;
    setCoarse(k);
    detailEl.style.display = 'none';
    renderCube(true);
  });
});

(async () => {
  const m = /sport=(\w+)/.exec(location.hash);
  const initial = m && SPORTS[m[1]] ? m[1] : 'nba';
  await loadSport(initial);
})();

function animate() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

</script>
